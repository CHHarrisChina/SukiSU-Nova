name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        required: true
        type: string
      package_name:
        required: false
        default: ''
        type: string
      version_code:
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      kmi:
        required: true
        default: 'android16-6.12'
        type: string
      package_name:
        required: false
        default: 'com.sukisu.nova'
        type: string
      version_code:
        required: false
        default: '35000'
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-20260828
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kernelsu.ko
        run: |
          set -eux
          cd kernel
          EXTRA_ARGS=""
          if [ -n "${{ inputs.package_name }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS KSU_PACKAGE_NAME=${{ inputs.package_name }}"
          fi
          if [ -n "${{ inputs.version_code }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS KSU_VERSION_CODE=${{ inputs.version_code }}"
          fi
          CONFIG_KSU=m CC=clang make $EXTRA_ARGS 2>&1 | tail -30
          ls -la kernelsu.ko
          llvm-strip -d kernelsu.ko
          cp kernelsu.ko "../${{ inputs.kmi }}_kernelsu.ko"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kmi }}-lkm
          path: ${{ inputs.kmi }}_kernelsu.ko
